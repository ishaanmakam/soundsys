name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: dotnet format (verify)
        run: dotnet format soundsys.slnx --verify-no-changes --verbosity minimal

  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    name: build + test (${{ matrix.rid }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build soundsys.slnx -c Release
      - name: Test
        env:
          SOUNDSYS_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: dotnet test soundsys.slnx -c Release --no-build --logger "trx;LogFilePrefix=${{ matrix.rid }}" --logger "console;verbosity=normal" --results-directory TestResults --blame-hang-timeout 4m --blame-hang-dump-type none
      - name: Publish smoke (self-contained, ${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish src/Soundsys.App/Soundsys.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o publish/app
          dotnet publish src/Soundsys.Diag/Soundsys.Diag.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o publish/diag
          Get-ChildItem publish -Recurse -Include *.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.FullName, ($_.Length / 1MB) }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.rid }}
          path: screenshots
          if-no-files-found: warn
